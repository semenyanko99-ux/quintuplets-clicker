<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quintuplets Clicker 🌸</title>
  <link rel="stylesheet" href="Miku.css">
  <script type="module" src="Nino.js"></script>
</head>
<body>
  <video class="background-video" autoplay muted loop playsinline>
    <source src="the-quintessential-quintuplets.1920x1080.mp4"
            type="video/mp4">
  </video>
  <div class="overlay"></div>

  <main class="game-container">
    <section id="authPanel">
      <h2>Your Account</h2>
      <form id="authForm">
        <label for="username">Nickname</label>
        <input id="username" minlength="3" maxlength="16"
               pattern="[A-Za-z0-9_]{3,16}" required
               autocomplete="username" placeholder="Miku123">

        <label for="password">Password</label>
        <input id="password" type="password" minlength="6"
               required autocomplete="current-password"
               placeholder="Minimum 6 characters">

        <button type="submit">Log In</button>
        <button type="button" id="registerButton">
          Create New Account
        </button>
      </form>
      <p id="authMessage" role="status"></p>
    </section>

    <section id="gamePanel" hidden class="game-layout">
      <div class="game-main">
        <p>Player: <strong id="playerName"></strong></p>

        <div class="tokens">
          Tokens: <span id="tokens">0</span>
        </div>

        <p>Tokens per Click: <span id="power">1</span></p>

        <button id="clickButton">
          <img src="Volume_7_clean_cover_art.webp"
               alt="Miku" id="buttonImage">
          <span>CLICK!</span>
        </button>

        <p id="saveStatus" role="status">Loading…</p>

        <nav>
          <button data-section="shop">🛒 Shop</button>
          <button data-section="pets">🐱 Pets</button>
          <button data-section="skins">🎨 Skins</button>
          <button data-section="quests">📜 Quests</button>
        </nav>

        <section class="section" id="content">
          <h2>Welcome!</h2>
          <p>Click to earn Tokens.</p>
        </section>
        <button id="logoutButton" class="secondary">
          Log Out
        </button>
      </div>

      <aside class="leaderboard-panel" aria-label="Leaderboard">
        <h2>🏆 Leaderboard</h2>
        <ol id="leaderboardList" class="leaderboard-list">
          <li>Loading...</li>
        </ol>
      </aside>
    </section>
  </main>
</body>
</html>
